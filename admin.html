<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JB Cash Flow Admin</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root { --bg-dark: #09090b; --surface-dark: #18181b; --theme-blue: #007aff; --theme-red: #ef4444; --theme-green: #10b981; --text-main: #fafafa; --text-muted: #a1a1aa; }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, sans-serif; background: var(--bg-dark); color: var(--text-main); }
  .page { display: none; min-height: 100vh; } .page.active { display: block; }
  .toast-container { position: fixed; top: 20px; left: 0; width: 100%; display: flex; flex-direction: column; align-items: center; z-index: 9999; pointer-events: none; }
  .toast { background: #222; color: #fff; padding: 12px 24px; border-radius: 16px; font-size: 14px; font-weight: 600; margin-bottom: 10px; transition: 0.3s; opacity: 0; transform: translateY(-20px); }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.success { border-left: 4px solid var(--theme-green); } .toast.error { border-left: 4px solid var(--theme-red); }
  .login-container { height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 24px; background: var(--bg-dark); }
  .login-form { background: var(--surface-dark); padding: 32px; border-radius: 20px; border: 1px solid #222; }
  .input-group input { width: 100%; padding: 16px; border-radius: 16px; border: 1px solid #333; font-size: 15px; background: #111; color: #fff; margin-top: 8px; outline: none; }
  .input-group input:focus { border-color: var(--theme-blue); }
  .btn-primary { padding: 16px; background: var(--theme-blue); color: #fff; border: none; border-radius: 16px; font-size: 16px; font-weight: 700; width: 100%; cursor: pointer; }
  .dashboard-header { display: flex; justify-content: space-between; align-items: center; padding: 20px 24px; border-bottom: 1px solid #222; position: sticky; top: 0; background: var(--bg-dark); z-index: 10; }
  .dashboard-content { padding: 24px; padding-bottom: 80px; }
  .admin-product-item { display: flex; align-items: center; gap: 16px; background: var(--surface-dark); padding: 16px; border-radius: 16px; margin-bottom: 14px; border: 1px solid #222; }
  .admin-product-item img { width: 75px; height: 75px; border-radius: 12px; object-fit: cover; }
  .btn-icon { background: #2a1a1a; color: var(--theme-red); border: none; width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; flex-shrink: 0; }
  .log-container { background: var(--surface-dark); padding: 20px; border-radius: 16px; border: 1px solid #222; }
  .form-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-dark); z-index: 100; display: flex; flex-direction: column; transform: translateY(100%); transition: transform 0.2s; }
  .form-overlay.show { transform: translateY(0); }
  .form-header { display: flex; justify-content: space-between; padding: 20px; border-bottom: 1px solid #222; }
  .form-body { padding: 20px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
  .form-card input, .form-card select, .form-card textarea { width: 100%; padding: 16px; border-radius: 12px; border: 1px solid #333; font-size: 14px; background: #111; color: #fff; outline: none; }
  .form-card input:focus, .form-card select:focus { border-color: var(--theme-blue); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .upload-area { border: 2px dashed #333; border-radius: 16px; padding: 24px; text-align: center; cursor: pointer; background: #111; color: var(--text-muted); }
  .upload-area img { max-width: 100%; max-height: 150px; border-radius: 12px; margin-top: 10px; }
</style>
</head>
<body>

<div class="toast-container" id="toast-container"></div>

<div id="page-login" class="page active">
  <div class="login-container">
    <div class="login-form">
      <h2 style="text-align:center; margin-bottom: 20px; color: #fff;">JB CASH FLOW</h2>
      <div class="input-group"><input type="text" id="login-username" placeholder="Username"></div>
      <div class="input-group"><input type="password" id="login-password" placeholder="Password"></div>
      <button class="btn-primary" onclick="doLogin()" style="margin-top: 20px;">MASUK</button>
    </div>
  </div>
</div>

<div id="page-dashboard" class="page">
  <div class="dashboard-header">
    <h2 style="font-size: 20px; color: #fff;">Dashboard</h2>
    <button class="btn-icon" style="width:auto; padding: 0 16px; background: #222; color: #fff;" onclick="doLogout()">KELUAR</button>
  </div>
  <div class="dashboard-content">
    <div style="display:flex; justify-content:space-between; margin-bottom: 20px;">
      <h3 style="font-size: 18px; color: #fff;">Daftar Produk</h3>
      <button class="btn-primary" style="width:auto; padding: 10px 20px; border-radius: 8px;" onclick="toggleForm()">+ Tambah</button>
    </div>
    <div id="admin-product-list"></div>
    
    <h3 style="margin-top:30px; margin-bottom:15px; font-size: 18px; color: #fff;">Jejak Aktivitas</h3>
    <div id="log-list" class="log-container"></div>
  </div>
</div>

<div class="form-overlay" id="form-overlay">
  <div class="form-header">
    <h3 style="font-size: 18px; color: #fff;">Tambah Produk</h3>
    <button style="background: none; border: none; color: var(--text-muted); font-size: 15px; font-weight: 600;" onclick="toggleForm()">BATAL</button>
  </div>
  <div class="form-body">
    <div class="form-card">
      <input type="text" id="inp-nama" placeholder="Nama Produk">
      <div class="form-row">
        <input type="number" id="inp-harga" placeholder="Harga Jual">
        <input type="number" id="inp-harga-coret" placeholder="Harga Coret">
      </div>
      <div class="form-row">
        <select id="inp-kategori"><option>Free Fire</option><option>Mobile Legends</option><option>Flash Sale</option><option>Pelajar</option></select>
        <input type="text" id="inp-wa" placeholder="No WA (628...)">
      </div>
      <div class="upload-area" onclick="document.getElementById('inp-file').click()">
        <i class="fa-solid fa-cloud-arrow-up" style="font-size:24px;"></i>
        <p id="upload-text">Pilih Foto</p>
        <img id="preview-img" style="display:none;">
      </div>
      <input type="file" id="inp-file" accept="image/*" style="display: none;" onchange="previewGambar(event)">
      <input type="text" id="inp-promo" placeholder="Label Promo">
    </div>
    <button class="btn-primary" onclick="tambahProduk()" style="margin-top: 10px;">SIMPAN PRODUK</button>
  </div>
</div>

<!-- FIREBASE SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // GANTI PAKE CONFIG DARI FIREBASE LO (SAMA KAYAK YANG DI INDEX.HTML)
  const firebaseConfig = {
    apiKey: "MASUKIN_API_KEY_LO",
    authDomain: "MASUKIN_AUTH_DOMAIN_LO",
    projectId: "MASUKIN_PROJECT_ID_LO",
    storageBucket: "MASUKIN_BUCKET_LO",
    messagingSenderId: "MASUKIN_SENDER_ID_LO",
    appId: "MASUKIN_APP_ID_LO"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  window.fsAddProduct = async (data) => await addDoc(collection(db, "products"), data);
  window.fsDeleteProduct = async (id) => await deleteDoc(doc(db, "products", id));
  window.fsListenProducts = (callback) => {
    onSnapshot(collection(db, "products"), (snapshot) => {
      const prods = [];
      snapshot.forEach(doc => prods.push({ id: doc.id, ...doc.data() }));
      callback(prods);
    });
  }
</script>

<script>
  let base64Img = null;
  let token = localStorage.getItem('admin_token') || null;
  let products = [];

  function showToast(msg, type) {
    const c = document.getElementById('toast-container');
    const t = document.createElement('div');
    t.className = `toast ${type}`;
    t.innerText = msg;
    c.appendChild(t);
    setTimeout(() => t.classList.add('show'), 10);
    setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3000);
  }

  function showPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function doLogin() {
    if (document.getElementById('login-username').value === 'JB Cash Flow' && document.getElementById('login-password').value === '12123242') {
      localStorage.setItem('admin_token', 'admin');
      showPage('page-dashboard');
      loadDashboard();
      showToast('Login Berhasil!', 'success');
    } else { showToast('Username atau Password salah!', 'error'); }
  }

  function doLogout() {
    localStorage.removeItem('admin_token');
    showPage('page-login');
  }

  function previewGambar(e) {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(ev) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          canvas.width = 400;
          canvas.height = img.height * (400 / img.width);
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          base64Img = canvas.toDataURL('image/jpeg', 0.6);
          document.getElementById('preview-img').src = base64Img;
          document.getElementById('preview-img').style.display = 'block';
          document.getElementById('upload-text').innerText = 'Ganti Foto';
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }
  }

  function toggleForm() { document.getElementById('form-overlay').classList.toggle('show'); }

  async function tambahProduk() {
    const name = document.getElementById('inp-nama').value;
    const price = document.getElementById('inp-harga').value;
    const wa = document.getElementById('inp-wa').value;
    if(!name || !price || !wa) return showToast('Lengkapi data terlebih dahulu!', 'error');

    const payload = {
      name, price, wa,
      old_price: document.getElementById('inp-harga-coret').value || null,
      kategori: document.getElementById('inp-kategori').value,
      image: base64Img || 'https://placehold.co/400x400/18181b/a1a1aa?text=No+Img',
      promo: document.getElementById('inp-promo').value,
      created_at: Date.now()
    };

    await window.fsAddProduct(payload);
    toggleForm();
    showToast('Produk ditambahkan ke server!', 'success');
    
    document.getElementById('inp-nama').value = '';
    document.getElementById('inp-harga').value = '';
    document.getElementById('inp-wa').value = '';
    document.getElementById('preview-img').style.display = 'none';
    document.getElementById('upload-text').innerText = 'Pilih Foto';
    base64Img = null;
  }

  async function hapusProduk(id) {
    if(confirm('Hapus produk ini (Laku)?')) {
      await window.fsDeleteProduct(id);
      showToast('Produk berhasil dihapus!', 'success');
    }
  }

  function loadDashboard() {
    window.fsListenProducts((data) => {
      products = data;
      document.getElementById('admin-product-list').innerHTML = products.length ? products.map(p => `
        <div class="admin-product-item">
          <img src="${p.image}">
          <div style="flex:1;">
            <h4 style="font-size:15px; font-weight:700; color: #fff;">${p.name}</h4>
            <div style="font-size:12px; color:var(--text-muted); margin: 4px 0;">${p.kategori}</div>
            <div style="font-size:15px; color:var(--theme-blue); font-weight:800;">Rp ${Number(p.price).toLocaleString('id-ID')}</div>
          </div>
          <button class="btn-icon" onclick="hapusProduk('${p.id}')"><i class="fa-solid fa-trash"></i></button>
        </div>
      `).join('') : '<p style="text-align:center; color:#888; padding: 20px;">Belum ada produk.</p>';

      // Render Log (Karena Firebase nggak nyimpen log otomatis, kita tampilin dummy aja atau urungkan)
      document.getElementById('log-list').innerHTML = `<p style="text-align:center; color:var(--text-muted); font-size:14px;">Aktivitas tersimpan di server Firebase.</p>`;
    });
  }

  if (token) { showPage('page-dashboard'); loadDashboard(); } 
  else { showPage('page-login'); }
</script>
</body>
</html>
