<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JB Cash Flow Admin</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  /* GANTI FONT PAKE BAWAAN HP BIAR GAK LEMOT NGE-LOAD FONT DARI GOOGLE */
  :root { 
    --bg-dark: #09090b; 
    --surface-dark: #18181b; 
    --theme-blue: #007aff; 
    --theme-red: #ef4444; 
    --theme-green: #10b981;
    --text-main: #fafafa;
    --text-muted: #a1a1aa;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg-dark); color: var(--text-main); }
  
  .page { display: none; min-height: 100vh; }
  .page.active { display: block; }
  /* ANIMASI DIBUANG BIAR RINGAN */

  /* TOAST NOTIF */
  .toast-container { position: fixed; top: 20px; left: 0; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px; z-index: 9999; pointer-events: none; }
  .toast { 
    background: #222; border: 1px solid #333; color: #fff; padding: 12px 24px; border-radius: 16px; font-size: 14px; font-weight: 600;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 10px;
    transition: opacity 0.2s;
  }
  .toast.success { border-left: 4px solid var(--theme-green); }
  .toast.error { border-left: 4px solid var(--theme-red); }

  /* LOGIN */
  .login-container { height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 24px; background: var(--bg-dark); }
  .login-form { background: var(--surface-dark); border: 1px solid #222; padding: 32px; border-radius: 20px; display: flex; flex-direction: column; gap: 20px; }
  .input-group input { width: 100%; padding: 16px; border-radius: 16px; border: 1px solid #333; font-size: 15px; background: #111; color: #fff; outline: none; margin-top: 8px; font-family: inherit; }
  .input-group input:focus { border-color: var(--theme-blue); }
  .btn-primary { padding: 16px; background: var(--theme-blue); color: #fff; border: none; border-radius: 16px; font-size: 16px; font-weight: 700; cursor: pointer; width: 100%; }
  
  /* DASHBOARD */
  .dashboard-header { display: flex; justify-content: space-between; align-items: center; padding: 20px 24px; background: var(--bg-dark); border-bottom: 1px solid #222; position: sticky; top: 0; z-index: 50; }
  .dashboard-content { padding: 24px; padding-bottom: 80px; }
  
  .admin-product-item { display: flex; align-items: center; gap: 16px; background: var(--surface-dark); border: 1px solid #222; padding: 16px; border-radius: 16px; margin-bottom: 14px; }
  .admin-product-item img { width: 75px; height: 75px; border-radius: 12px; object-fit: cover; }
  .btn-icon { background: #2a1a1a; color: var(--theme-red); border: none; width: 44px; height: 44px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
  
  /* LOG */
  .log-container { background: var(--surface-dark); border: 1px solid #222; padding: 20px; border-radius: 16px; }
  .log-item { display: flex; gap: 12px; padding-bottom: 20px; }
  .log-item:last-child { padding-bottom: 0; }
  .log-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--theme-blue); margin-top: 4px; flex-shrink: 0; }
  .log-content { flex: 1; }
  .log-text { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .log-time { font-size: 12px; color: var(--text-muted); }

  /* FORM */
  .form-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-dark); z-index: 100; display: flex; flex-direction: column; transform: translateY(100%); transition: transform 0.2s; }
  .form-overlay.show { transform: translateY(0); }
  .form-header { display: flex; justify-content: space-between; align-items: center; padding: 20px; border-bottom: 1px solid #222; background: var(--bg-dark); }
  .form-body { padding: 20px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 16px; }
  
  .form-card { display: flex; flex-direction: column; gap: 12px; }
  .form-card input, .form-card select, .form-card textarea { width: 100%; padding: 16px; border-radius: 12px; border: 1px solid #333; font-size: 14px; background: #111; color: #fff; outline: none; font-family: inherit; }
  .form-card input:focus, .form-card select:focus { border-color: var(--theme-blue); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  
  .upload-area { border: 2px dashed #333; border-radius: 16px; padding: 24px; text-align: center; cursor: pointer; color: var(--text-muted); display: flex; flex-direction: column; align-items: center; gap: 10px; background: #111; }
  .upload-area img { max-width: 100%; max-height: 150px; border-radius: 12px; margin-top: 10px; object-fit: cover; }
</style>
</head>
<body>

<div class="toast-container" id="toast-container"></div>

<div id="page-login" class="page active">
  <div class="login-container">
    <div class="login-form">
      <div style="text-align: center; margin-bottom: 10px;">
        <h2 style="font-size: 28px; color: #fff; font-weight: 800;">JB CASH FLOW</h2>
        <p style="color: var(--text-muted); margin-top: 8px; font-size: 14px;">Selamat datang kembali, Admin.</p>
      </div>
      <div class="input-group"><input type="text" id="login-username" placeholder="Username"></div>
      <div class="input-group"><input type="password" id="login-password" placeholder="Password"></div>
      <button class="btn-primary" onclick="doLogin()" style="margin-top: 10px;">MASUK DASHBOARD</button>
    </div>
  </div>
</div>

<div id="page-dashboard" class="page">
  <div class="dashboard-header">
    <h2 style="font-size: 20px; color: #fff; font-weight: 700;">Dashboard</h2>
    <button class="btn-icon" style="width:auto; padding: 0 16px; font-weight: 700; font-size: 13px; color: #fff; background: #222;" onclick="doLogout()">KELUAR</button>
  </div>

  <div class="dashboard-content">
    <div style="display:flex; justify-content:space-between; align-items: center; margin-bottom: 20px;">
      <h3 style="font-size: 18px; color: #fff; font-weight: 700;">Daftar Produk</h3>
      <button class="btn-primary" style="padding: 10px 20px; width:auto; font-size: 14px; border-radius: 8px;" onclick="toggleForm()">+ Tambah</button>
    </div>

    <div id="admin-product-list"></div>

    <h3 style="margin-top:30px; margin-bottom:15px; font-size: 18px; color: #fff; font-weight: 700;">Jejak Aktivitas</h3>
    <div id="log-list" class="log-container"></div>

    <h3 style="margin-top:30px; margin-bottom:15px; font-size: 18px; color: #fff; font-weight: 700;">Pengaturan Bantuan</h3>
    <div style="background: var(--surface-dark); border: 1px solid #222; padding: 20px; border-radius: 16px;">
      <textarea id="bantuan-teks" style="min-height: 100px; width: 100%; padding: 16px; border-radius: 12px; border: 1px solid #333; font-size: 14px; background: #111; color: #fff; outline: none; font-family: inherit; resize: vertical;"></textarea>
      <button class="btn-primary" onclick="simpanBantuan()" style="margin-top: 16px;">SIMPAN BANTUAN</button>
    </div>
  </div>
</div>

<div class="form-overlay" id="form-overlay">
  <div class="form-header">
    <h3 style="font-size: 18px; color: #fff; font-weight: 700;">Tambah Produk</h3>
    <button style="background: transparent; border: none; color: var(--text-muted); font-size: 15px; font-weight: 600; cursor: pointer; padding: 8px;" onclick="toggleForm()">BATAL</button>
  </div>
  
  <div class="form-body">
    <div class="form-card">
      <input type="text" id="inp-nama" placeholder="Nama Produk">
      <div class="form-row">
        <input type="number" id="inp-harga" placeholder="Harga Jual">
        <input type="number" id="inp-harga-coret" placeholder="Harga Coret">
      </div>
      <div class="form-row">
        <select id="inp-kategori">
          <option value="Free Fire">Free Fire</option>
          <option value="Mobile Legends">Mobile Legends</option>
          <option value="Flash Sale">Flash Sale</option>
          <option value="Pelajar">Pelajar</option>
        </select>
        <input type="text" id="inp-wa" placeholder="No WA (628...)">
      </div>
      
      <div class="upload-area" onclick="document.getElementById('inp-file').click()">
        <i class="fa-solid fa-cloud-arrow-up" style="font-size:24px;"></i>
        <span id="upload-text" style="font-weight: 600; font-size: 14px;">Pilih Foto dari Galeri</span>
        <img id="preview-img" style="display:none;">
      </div>
      <input type="file" id="inp-file" accept="image/*" style="display: none;" onchange="previewGambar(event)">
      
      <input type="text" id="inp-promo" placeholder="Label Promo (Cth: 50% OFF)">
    </div>
    
    <button class="btn-primary" onclick="tambahProduk()" style="margin-top: 10px; padding: 16px;">SIMPAN PRODUK</button>
  </div>
</div>

<script>
  function showToast(message, type = 'success') {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    const icon = type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation';
    toast.innerHTML = `<i class="fa-solid ${icon}"></i> ${message}`;
    container.appendChild(toast);
    setTimeout(() => toast.style.opacity = '1', 50);
    setTimeout(() => {
      toast.style.opacity = '0';
      setTimeout(() => toast.remove(), 300);
    }, 2500);
  }

  const getDB = (key) => JSON.parse(localStorage.getItem('jb_' + key)) || [];
  const setDB = (key, val) => localStorage.setItem('jb_' + key, JSON.stringify(val));

  let products = getDB('products');
  let logs = getDB('logs');
  let bantuanText = localStorage.getItem('jb_bantuan') || "Hubungi admin JB Cash Flow di +62 883-8003-5722 untuk bantuan.";

  let token = localStorage.getItem('admin_token') || null;
  let base64Img = null;

  function showPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function doLogin() {
    const u = document.getElementById('login-username').value;
    const p = document.getElementById('login-password').value;
    
    if (u === 'JB Cash Flow' && p === '12123242') {
      token = 'admin-login';
      localStorage.setItem('admin_token', token);
      showPage('page-dashboard');
      showToast('Berhasil masuk Dashboard!', 'success');
      loadDashboard();
    } else { 
      showToast('Username atau Password salah!', 'error');
    }
  }

  function doLogout() {
    localStorage.removeItem('admin_token');
    token = null;
    showPage('page-login');
    showToast('Berhasil keluar.', 'success');
  }

  function previewGambar(event) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 400; // Dikecilin biar anti lag
          const scale = MAX_WIDTH / img.width;
          canvas.width = MAX_WIDTH;
          canvas.height = img.height * scale;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          base64Img = canvas.toDataURL('image/jpeg', 0.6); // Compress ketat
          
          document.getElementById('preview-img').src = base64Img;
          document.getElementById('preview-img').style.display = 'block';
          document.getElementById('upload-text').innerText = "Ganti Foto";
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }
  }

  function toggleForm() {
    const form = document.getElementById('form-overlay');
    form.classList.toggle('show');
  }

  function tambahProduk() {
    const payload = {
      id: Date.now(),
      name: document.getElementById('inp-nama').value,
      price: document.getElementById('inp-harga').value,
      old_price: document.getElementById('inp-harga-coret').value || null,
      kategori: document.getElementById('inp-kategori').value,
      wa: document.getElementById('inp-wa').value,
      image: base64Img || 'https://placehold.co/400x400/18181b/a1a1aa?text=No+Img',
      promo: document.getElementById('inp-promo').value
    };

    if (!payload.name || !payload.price || !payload.wa) return showToast("Lengkapi data terlebih dahulu!", "error");

    products.push(payload);
    setDB('products', products);
    
    const jam = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
    logs.push({ message: `Menambahkan produk: ${payload.name}`, created_at: jam, timestamp: Date.now() });
    setDB('logs', logs);

    base64Img = null;
    document.getElementById('inp-nama').value = '';
    document.getElementById('inp-harga').value = '';
    document.getElementById('inp-harga-coret').value = '';
    document.getElementById('inp-wa').value = '';
    document.getElementById('inp-promo').value = '';
    document.getElementById('preview-img').style.display = 'none';
    document.getElementById('upload-text').innerText = "Pilih Foto dari Galeri";
    
    toggleForm();
    showToast('Produk berhasil ditambahkan!', 'success');
    loadDashboard();
  }

  function hapusProduk(id) {
    if (!confirm("Hapus produk ini (Laku)?")) return;
    const product = products.find(p => p.id === id);
    products = products.filter(p => p.id !== id);
    setDB('products', products);
    
    const jam = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
    logs.push({ message: `Menghapus produk (Laku): ${product.name}`, created_at: jam, timestamp: Date.now() });
    setDB('logs', logs);
    
    showToast('Produk berhasil dihapus!', 'success');
    loadDashboard();
  }

  function simpanBantuan() {
    bantuanText = document.getElementById('bantuan-teks').value;
    localStorage.setItem('jb_bantuan', bantuanText);
    showToast('Teks bantuan tersimpan!', 'success');
    loadDashboard();
  }

  function loadDashboard() {
    const now = Date.now();
    logs = logs.filter(log => (now - log.timestamp) < 300000);
    setDB('logs', logs);

    const pList = document.getElementById('admin-product-list');
    pList.innerHTML = products.length ? products.map(p => `
      <div class="admin-product-item">
        <img src="${p.image}">
        <div style="flex:1;">
          <h4 style="font-size:15px; font-weight:700; margin-bottom: 4px; color: #fff;">${p.name}</h4>
          <div style="font-size:12px; color:var(--text-muted); margin-bottom: 4px;">${p.kategori}</div>
          <div style="font-size:15px; color:var(--theme-blue); font-weight:800;">Rp ${Number(p.price).toLocaleString('id-ID')}</div>
        </div>
        <button class="btn-icon" onclick="hapusProduk(${p.id})"><i class="fa-solid fa-check"></i></button>
      </div>
    `).join('') : '<p style="text-align:center; color:var(--text-muted); font-size:14px; padding: 20px 0;">Belum ada produk.</p>';

    const lList = document.getElementById('log-list');
    lList.innerHTML = logs.length ? logs.slice().reverse().map(l => `
      <div class="log-item">
        <div class="log-dot"></div>
        <div class="log-content">
          <div class="log-text">${l.message}</div>
          <div class="log-time">${l.created_at}</div>
        </div>
      </div>
    `).join('') : '<p style="text-align:center; color:var(--text-muted); font-size:14px; padding: 20px 0;">Belum ada log.</p>';

    document.getElementById('bantuan-teks').value = bantuanText;
  }

  if (token) {
    showPage('page-dashboard');
    loadDashboard();
  } else {
    showPage('page-login');
  }
</script>
</body>
</html>
