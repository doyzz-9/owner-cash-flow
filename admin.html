<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JB Cash Flow</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root { 
    --bg-dark: #09090b; 
    --surface-dark: #18181b; 
    --theme-color: #007aff; 
    --text-main: #fafafa;
    --text-muted: #a1a1aa;
    --spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    background: var(--bg-dark); 
    color: var(--text-main); 
    padding-bottom: 110px; 
    overflow-x: hidden;
  }
  
  /* ANIMASI PAGE LOAD */
  .fade-up { opacity: 0; transform: translateY(20px); animation: fadeUp 0.6s var(--spring) forwards; }
  @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

  /* TOPBAR */
  .topbar { 
    display: flex; align-items: center; gap: 16px; padding: 18px 24px; 
    background: rgba(9, 9, 11, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(255,255,255,0.05); position: sticky; top: 0; z-index: 50; 
    animation: slideDown 0.5s var(--spring);
  }
  @keyframes slideDown { from { transform: translateY(-100%); } to { transform: translateY(0); } }
  
  .brand { font-weight: 800; font-size: 20px; color: var(--theme-color); white-space: nowrap; letter-spacing: -0.5px; }
  .search-wrap { 
    flex: 1; display: flex; align-items: center; background: #27272a; 
    border-radius: 14px; padding: 12px 16px; gap: 10px; border: 1px solid rgba(255,255,255,0.05);
    transition: all 0.3s var(--spring);
  }
  .search-wrap:focus-within { border-color: var(--theme-color); box-shadow: 0 0 0 3px rgba(0,122,255,0.2); }
  .search-wrap input { border: none; background: transparent; outline: none; font-size: 15px; width: 100%; color: #fff; }
  .search-wrap input::placeholder { color: var(--text-muted); }
  
  .scroll-area { padding: 24px 24px 0; }

  /* BANNER */
  .banner-card { border-radius: 24px; overflow: hidden; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .banner-img { display: block; width: 100%; transition: transform 0.5s var(--spring); }
  .banner-card:hover .banner-img { transform: scale(1.05); }

  /* KATEGORI */
  .kategori-sec { margin-top: 32px; }
  .kategori-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }
  .kat-item { display: flex; flex-direction: column; align-items: center; gap: 12px; font-size: 12px; font-weight: 600; color: var(--text-muted); cursor: pointer; }
  .kat-icon { 
    width: 60px; height: 60px; border-radius: 20px; display: flex; align-items: center; justify-content: center; 
    font-size: 24px; background: var(--surface-dark); color: var(--theme-color); 
    border: 1px solid rgba(255,255,255,0.05); transition: all 0.4s var(--spring);
  }
  .kat-item:active .kat-icon { transform: scale(0.85); }
  .kat-item.active .kat-icon { 
    background: var(--theme-color); color: #fff; 
    box-shadow: 0 8px 24px rgba(0,122,255,0.4); border-color: transparent; 
    transform: translateY(-5px);
  }
  .kat-item.active span { color: #fff; font-weight: 700; }

  /* GRID PRODUK + STAGGERED ANIMATION */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 20px; margin-top: 32px; }
  
  .card { 
    background: var(--surface-dark); border: 1px solid rgba(255,255,255,0.05); 
    border-radius: 24px; padding: 16px; display: flex; flex-direction: column; 
    transition: transform 0.3s var(--spring), box-shadow 0.3s var(--spring);
    opacity: 0; transform: translateY(30px); animation: cardPop 0.5s var(--spring) forwards;
  }
  @keyframes cardPop { to { opacity: 1; transform: translateY(0); } }
  .card:active { transform: scale(0.94); box-shadow: 0 0 20px rgba(0,0,0,0.5); }

  .card-img-wrap { position: relative; width: 100%; aspect-ratio: 1/1; border-radius: 16px; overflow: hidden; margin-bottom: 16px; background: #000; }
  .card-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s var(--spring); }
  .card:hover .card-img { transform: scale(1.1); }
  
  .promo-badge { 
    position: absolute; top: 10px; left: 10px; background: #ef4444; color: #fff; 
    font-size: 11px; font-weight: 800; padding: 6px 10px; border-radius: 10px; z-index: 2;
    animation: pulseGlow 2s infinite;
  }
  @keyframes pulseGlow { 0% { box-shadow: 0 0 0 0 rgba(239,68,68,0.7); } 70% { box-shadow: 0 0 0 10px rgba(239,68,68,0); } 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); } }

  .card .name { font-size: 15px; font-weight: 700; margin-bottom: 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4; }
  .price-wrap { margin-top: auto; display: flex; flex-direction: column; gap: 4px; }
  .price-old { font-size: 12px; color: var(--text-muted); text-decoration: line-through; }
  .price { font-size: 18px; font-weight: 800; color: var(--theme-color); }
  
  .wa-btn { 
    display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 16px; padding: 14px; 
    background: #10b981; color: #fff; font-weight: 700; font-size: 14px; border-radius: 16px; text-decoration: none; 
    transition: transform 0.2s var(--spring), background 0.2s;
  }
  .wa-btn:hover { background: #059669; }
  .wa-btn:active { transform: scale(0.92); }
  
  /* BOTTOM NAV */
  .bottom-nav { 
    position: fixed; bottom: 24px; left: 24px; right: 24px; display: flex; justify-content: space-around; 
    background: rgba(24, 24, 27, 0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-radius: 28px; padding: 12px; border: 1px solid rgba(255,255,255,0.08); z-index: 60; 
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    animation: slideUp 0.6s var(--spring);
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  
  .bn-item { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: var(--text-muted); text-decoration: none; padding: 10px 24px; border-radius: 20px; transition: all 0.3s var(--spring); }
  .bn-item i { font-size: 22px; transition: transform 0.3s var(--spring); }
  .bn-item:active i { transform: scale(0.7); }
  .bn-item.active { color: var(--theme-color); background: rgba(0,122,255,0.15); }
  
  /* MODAL */
  .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 100; display: flex; align-items: flex-end; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
  .modal-overlay.show { opacity: 1; pointer-events: auto; }
  .modal-content { background: var(--surface-dark); width: 100%; border-radius: 32px 32px 0 0; padding: 32px 24px 48px; transform: translateY(100%); transition: transform 0.4s var(--spring); border-top: 1px solid rgba(255,255,255,0.1); }
  .modal-overlay.show .modal-content { transform: translateY(0); }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">JB CASH FLOW</div>
  <div class="search-wrap">
    <i class="fa-solid fa-magnifying-glass" style="color: var(--text-muted);"></i>
    <input type="text" id="search-input" placeholder="Cari akun, item...">
  </div>
</header>

<div class="scroll-area">
  <div class="banner-card fade-up" style="animation-delay: 0.1s;">
    <img src="https://cdn.imagetourls.com/uploads/tyImg/FPWXGXn3.jpg" class="banner-img">
  </div>

  <section class="kategori-sec fade-up" style="animation-delay: 0.2s;">
    <div class="kategori-grid" id="category-list">
      <div class="kat-item active" onclick="filterCategory('Semua', this)"><div class="kat-icon"><i class="fa-solid fa-layer-group"></i></div><span>SEMUA</span></div>
      <div class="kat-item" onclick="filterCategory('Free Fire', this)"><div class="kat-icon"><i class="fa-solid fa-fire"></i></div><span>FREE FIRE</span></div>
      <div class="kat-item" onclick="filterCategory('Mobile Legends', this)"><div class="kat-icon"><i class="fa-solid fa-shield-halved"></i></div><span>MLBB</span></div>
      <div class="kat-item" onclick="filterCategory('Flash Sale', this)"><div class="kat-icon"><i class="fa-solid fa-bolt"></i></div><span>FLASH SALE</span></div>
      <div class="kat-item" onclick="filterCategory('Pelajar', this)"><div class="kat-icon"><i class="fa-solid fa-graduation-cap"></i></div><span>PELAJAR</span></div>
    </div>
  </section>

  <section class="fade-up" style="animation-delay: 0.3s;">
    <div id="product-grid" class="grid"></div>
  </section>
</div>

<nav class="bottom-nav">
  <a href="#" class="bn-item active" onclick="openModal('beranda')"><i class="fa-solid fa-house"></i><span>BERANDA</span></a>
  <a href="#" class="bn-item" onclick="openModal('bantuan')"><i class="fa-solid fa-circle-question"></i><span>BANTUAN</span></a>
</nav>

<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal-content" onclick="event.stopPropagation()">
    <h3 id="modal-title" style="text-align:center; margin-bottom: 24px; color: #fff; font-size: 22px;">Bantuan</h3>
    <div id="modal-body" style="font-size:16px; line-height:1.7; color: var(--text-muted); text-align: center;"></div>
  </div>
</div>

<!-- FIREBASE SDK (GANTI CONFIG NYA!) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "MASUKIN_API_KEY_LO",
    authDomain: "MASUKIN_AUTH_DOMAIN_LO",
    projectId: "MASUKIN_PROJECT_ID_LO",
    storageBucket: "MASUKIN_BUCKET_LO",
    messagingSenderId: "MASUKIN_SENDER_ID_LO",
    appId: "MASUKIN_APP_ID_LO"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  window.fetchProductsFromFirebase = function(callback) {
    onSnapshot(collection(db, "products"), (snapshot) => {
      const prods = [];
      snapshot.forEach(doc => prods.push({ id: doc.id, ...doc.data() }));
      callback(prods);
    });
  }
</script>

<script>
  let allProducts = [];
  let currentCategory = 'Semua';
  const themeColors = { 'Semua': '#007aff', 'Free Fire': '#ef4444', 'Mobile Legends': '#8b5cf6', 'Flash Sale': '#f59e0b', 'Pelajar': '#007aff' };
  const grid = document.getElementById('product-grid');
  const searchInput = document.getElementById('search-input');

  function formatRupiah(n) { return 'Rp ' + Number(n).toLocaleString('id-ID'); }

  function renderProducts() {
    let filtered = allProducts;
    if (currentCategory !== 'Semua') filtered = filtered.filter(p => p.kategori === currentCategory);
    const q = searchInput.value.toLowerCase();
    if (q) filtered = filtered.filter(p => p.name.toLowerCase().includes(q));

    if (!filtered.length) {
      grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 60px 0; opacity: 0.5;"><i class="fa-solid fa-box-open" style="font-size: 48px; margin-bottom: 16px; color: var(--text-muted);"></i><p style="font-size: 16px; color: var(--text-muted);">Belum ada produk di sini.</p></div>`;
      return;
    }

    grid.innerHTML = filtered.map((p, index) => {
      let discountPct = "";
      if (p.old_price && p.old_price > p.price) discountPct = Math.round(((p.old_price - p.price) / p.old_price) * 100) + "% OFF";
      const waText = `Halo%20Admin%20JB%20Cash%20Flow,%20saya%20tertarik%20untuk%20membeli%20produk%20*${encodeURIComponent(p.name)}*.%20Apakah%20stoknya%20masih%20ada?`;
      
      // ANIMASI STAGGERED (Muncul berurutan)
      const delay = index * 0.1;

      return `
      <div class="card" style="animation-delay: ${delay}s;">
        <div class="card-img-wrap">
          ${discountPct ? `<div class="promo-badge">${discountPct}</div>` : ''}
          <img src="${p.image || 'https://placehold.co/400x400/18181b/a1a1aa?text=No+Img'}" class="card-img" loading="lazy">
        </div>
        <div class="name">${p.name}</div>
        <div class="price-wrap">
          ${p.old_price ? `<span class="price-old">${formatRupiah(p.old_price)}</span>` : ''}
          <div class="price">${formatRupiah(p.price)}</div>
        </div>
        <a class="wa-btn" href="https://wa.me/${p.wa}?text=${waText}" target="_blank">
          <i class="fa-brands fa-whatsapp"></i> BELI
        </a>
      </div>`;
    }).join('');
  }

  function filterCategory(cat, el) {
    currentCategory = cat;
    const color = themeColors[cat];
    document.documentElement.style.setProperty('--theme-color', color);
    document.querySelectorAll('.kat-item').forEach(item => item.classList.remove('active'));
    if(el) el.classList.add('active');
    
    // Animasi ulang grid tiap ganti kategori
    grid.style.animation = 'none';
    grid.offsetHeight; 
    grid.style.animation = '';
    
    renderProducts();
  }

  searchInput.addEventListener('input', renderProducts);

  const overlay = document.getElementById('modal-overlay');
  function openModal(type) {
    if (type === 'beranda') {
      window.scrollTo({ top: 0, behavior: 'smooth' });
      document.querySelectorAll('.bn-item')[0].classList.add('active');
      document.querySelectorAll('.bn-item')[1].classList.remove('active');
      return;
    }
    if (type === 'bantuan') {
      document.querySelectorAll('.bn-item')[1].classList.add('active');
      document.querySelectorAll('.bn-item')[0].classList.remove('active');
      document.getElementById('modal-body').innerText = "Hubungi admin JB Cash Flow di +62 883-8003-5722 untuk bantuan.";
      overlay.classList.add('show');
    }
  }

  function closeModal(e) {
    if (e.target.id === 'modal-overlay') overlay.classList.remove('show');
  }

  window.fetchProductsFromFirebase((data) => {
    allProducts = data;
    renderProducts();
  });
</script>
</body>
</html>
